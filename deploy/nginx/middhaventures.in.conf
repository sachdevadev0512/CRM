server {
    listen 80;
    server_name middhaventures.in www.middhaventures.in;

    client_max_body_size 20M;

    root /var/www/crm/packages/form/dist;
    index index.html;

    location /admin/ {
        alias /var/www/crm/packages/admin/dist/;
        try_files $uri $uri/ /admin/index.html;
    }

    location = /admin {
        return 301 /admin/;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Hashed build output never changes for a given filename, so cache it aggressively.
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Marketing images/icons (public/assets). Not hashed, so use a moderate cache.
    location /assets/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # One SPA bundle: "/" is the marketing site, "/applynow" is the intake form.
    # index.html must always be revalidated so a deploy is picked up immediately.
    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location ~* ^/applynow/?$ {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # Unknown paths get the site's own "Page not found" view, with a real 404 status.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    error_page 404 /index.html;
}
